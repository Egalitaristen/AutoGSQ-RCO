model:
  name: "Qwen/Qwen3-8B"
  device: "cuda"
  dtype: "bfloat16"

data:
  dataset_name: "fineweb_edu"
  num_samples: 4096
  max_length: 4096

gsq:
  bitwidth_options: [2, 3, 4, "ternary"]
  init_method: "gptq"
  group_size: 128
  temperature: [2.0, 0.05]
  logit_scale: [100.0, 500.0]
  num_epochs: 10
  optimizer: "lion"
  learning_rate: 0.001

rco:
  target_bpw: 2.75
  eval_dataset: "wikitext2"
  num_steps: 2000
  lr: 0.01
  temperature: 1.0
  temperature_min: 0.1

gguf:
  gguf_type_tolerance_bpw: 0.15
  fallback_on_no_match: "round_down"

output:
  checkpoint_dir: "./runtime"
  run_id: null
