model:
  name: "./runtime/smollm_model"
  device: "cuda"
  dtype: "bfloat16"

data:
  dataset_name: "wikitext2"
  num_samples: 16
  max_length: 256

gsq:
  bitwidth_options: [2, 3, 4, "ternary"]
  init_method: "gptq"
  group_size: 64
  temperature: [2.0, 0.05]
  logit_scale: [100.0, 500.0]
  num_epochs: 2
  optimizer: "lion"
  learning_rate: 0.001
  steps_per_epoch: 32
  lr_logits: 0.0002
  lr_scales: 0.0001
  gs_weight_decay: 1.0
  warmup_ratio: 0.1
  gptq_nsamples: 8
  gptq_damping: 0.01
  calib_max_length: 256
  calib_device: "cpu"

rco:
  target_bpw: 2.75
  eval_dataset: "wikitext2"
  num_steps: 100
  lr: 0.01
  temperature: 1.0
  temperature_min: 0.1
  temperature_schedule: "linear"
  refine_steps: 10
  refine_batches: 2
  refine_max_length: 256

gguf:
  gguf_type_tolerance_bpw: 0.15
  fallback_on_no_match: "round_down"

output:
  checkpoint_dir: "./runtime/smollm_test"
  run_id: null
